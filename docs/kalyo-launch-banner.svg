<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="auto" style="border-radius: 16px; background: #020617; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background gradients -->
    <radialGradient id="bgGrad1" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGrad2" cx="80%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGrad3" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Card glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="630" rx="16" fill="#020617"/>
  <rect width="1200" height="630" fill="url(#bgGrad1)"/>
  <rect width="1200" height="630" fill="url(#bgGrad2)"/>
  <rect width="1200" height="630" fill="url(#bgGrad3)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top Pill Badge -->
  <g transform="translate(460, 48)">
    <rect width="280" height="38" rx="19" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
    <circle cx="24" cy="19" r="5" fill="#10b981"/>
    <text x="38" y="24" fill="#c7d2fe" font-size="13" font-weight="700" letter-spacing="1">PRÉSENTATION INTERACTIVE</text>
  </g>

  <!-- 3D Prism Logo Icon (K) -->
  <g transform="translate(600, 190) scale(1.1)">
    <circle cx="0" cy="0" r="62" fill="url(#logoGrad)" filter="url(#glow)" opacity="0.5"/>
    <rect x="-48" y="-48" width="96" height="96" rx="26" fill="#0f172a" stroke="url(#logoGrad)" stroke-width="2.5"/>
    <path d="M -18 -26 L -18 26 M -18 0 L 16 -24 M -6 -5 L 18 26" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Title: Kalyo -->
  <text x="600" y="325" text-anchor="middle" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Kalyo <tspan fill="#a855f7">—</tspan> Launch Presentation
  </text>

  <!-- Subtitle Arabic & French -->
  <text x="600" y="372" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="2">
    منصة رقمية مغربية شاملة لإدارة المشاريع والتدفقات المالية
  </text>
  <text x="600" y="405" text-anchor="middle" font-size="15" font-weight="500" fill="#64748b">
    Projet de Fin d'Études (PFE) — Stage au sein de MORITSOFT
  </text>

  <!-- Feature Cards Row -->
  <g transform="translate(150, 445)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="270" height="85" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2" opacity="0.9"/>
    <text x="24" y="36" fill="#818cf8" font-size="18">👔</text>
    <text x="56" y="34" fill="#f8fafc" font-size="15" font-weight="700">Espace Direction</text>
    <text x="24" y="60" fill="#94a3b8" font-size="12">Pilotage CA, Trésorerie &amp; TVA (MAD)</text>

    <!-- Card 2 -->
    <rect x="315" y="0" width="270" height="85" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2" opacity="0.9"/>
    <text x="339" y="36" fill="#34d399" font-size="18">🤝</text>
    <text x="371" y="34" fill="#f8fafc" font-size="15" font-weight="700">Portail Client</text>
    <text x="339" y="60" fill="#94a3b8" font-size="12">Validation jalons &amp; suivi factures</text>

    <!-- Card 3 -->
    <rect x="630" y="0" width="270" height="85" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2" opacity="0.9"/>
    <text x="654" y="36" fill="#22d3ee" font-size="18">⚡</text>
    <text x="686" y="34" fill="#f8fafc" font-size="15" font-weight="700">Démo Scénarisée</text>
    <text x="654" y="60" fill="#94a3b8" font-size="12">6 scènes interactives animées</text>
  </g>

  <!-- Interactive Call to Action Bar -->
  <g transform="translate(390, 560)">
    <rect width="420" height="42" rx="21" fill="url(#logoGrad)"/>
    <text x="210" y="26" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800" letter-spacing="1">
      ▶ OUVRIR LA PRÉSENTATION INTERACTIVE (HTML)
    </text>
  </g>
</svg>
